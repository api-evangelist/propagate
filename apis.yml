name: Propagate
description: Propagate (Propagate Brands) is an e-commerce accelerator and equity syndication
  platform founded by JD Jernigan and backed by 500 Global. It partners with early-stage
  direct-to-consumer brands selling on Shopify and Amazon — typically those under $1M in
  annual revenue and overlooked by larger aggregators — providing working capital plus
  growth marketing, branding, data collection, customer service, and supply-chain support
  to help them scale and reach acquisition-ready exits. It simultaneously lets individual
  investors take equity stakes in these growing private commerce brands to earn passive
  income. Propagate operates as a services-and-investment business rather than a software
  company and publishes no public developer API, SDK, or technical platform surface. As of
  August 2026 its website is also no longer reachable — propagatebrands.com and its www
  host resolve to Webflow's shared proxy but abort the TLS handshake, and archived captures
  show the site returning 403/404 since mid-2024 and a parked lander page by August 2025.
